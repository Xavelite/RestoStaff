<!doctype html>
<!-- The workspace palette is declared on the document itself rather than mounted
     by the authenticated layout. It therefore applies to sign-in, onboarding,
     the paired station, public booking and the product page too, and it is
     present at first paint — the old warm fallback used to flash on every load
     before the app shell mounted. -->
<html lang="en" data-design="workspace">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
