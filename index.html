<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>restogogo</title>
<!-- CSS order: tokens/base/state, shared components/controls, weekly grid, feedback, shell, page modules, print. -->
<link href="assets/css/tokens.css" rel="stylesheet"/>
<link href="assets/css/base.css" rel="stylesheet"/>
<link href="assets/css/page-state.css" rel="stylesheet"/>
<link href="assets/css/v2-components.css" rel="stylesheet"/>
<link href="assets/css/v2-controls.css" rel="stylesheet"/>
<link href="assets/css/operations.css" rel="stylesheet"/>
<link href="assets/css/weekly-grid.css" rel="stylesheet"/>
<link href="assets/css/v2-feedback.css" rel="stylesheet"/>
<link href="assets/css/topbar.css" rel="stylesheet"/>
<link href="assets/css/notifications.css" rel="stylesheet"/>
<link href="assets/css/brand.css" rel="stylesheet"/>
<link href="assets/css/pilot-guide.css" rel="stylesheet"/>
<link href="assets/css/employee-schedule.css" rel="stylesheet"/>
<link href="assets/css/planning.css" rel="stylesheet"/>
<link href="assets/css/badge-terminal.css" rel="stylesheet"/>
<link href="assets/css/actuals.css" rel="stylesheet"/>
<link href="assets/css/team.css" rel="stylesheet"/>
<link href="assets/css/restaurant.css" rel="stylesheet"/>
<link href="assets/css/print.css" rel="stylesheet"/>
</head>
<body class="logged-out">
<!-- restogogo brand login page -->
<section aria-label="restogogo access" class="brand-page rs-v2-page" id="login">
<header class="brand-topbar rs-v2-topbar">
<div class="brand-topbar__inner rs-v2-topbar-inner">
<div aria-label="restogogo" class="brand-logo">
<img alt="restogogo" class="brand-logo__image" src="assets/img/brand/restogogo_logo_transparent.png"/>
</div>
<div class="brand-pilot-pill" aria-label="Private pilot workspace">
<span>Private pilot</span>
<small>Workspace access only</small>
</div>
</div>
</header>
<div class="brand-shell rs-v2-shell">
<main class="brand-card rs-panel">
<section aria-label="Restaurant access form" class="brand-login-panel rs-card" id="brandLoginPanel">
<div class="brand-login-head">
<h2 id="loginRestaurantName">Welcome back</h2>
<p class="brand-login-subtitle" id="loginWorkspaceBadge">Sign in to continue to your workspace.</p>
</div>
<div class="brand-login-form">
<label>Restaurant
            <select autocomplete="organization" id="restaurantLoginSelect"></select>
</label>
<label>Username
            <input autocomplete="username" id="identityLoginName" placeholder="Owner or employee name"/>
</label>
<label>Password / PIN
            <input autocomplete="current-password" id="accessPin" inputmode="numeric" maxlength="4" placeholder="Password / PIN" type="password"/>
</label>
<p class="brand-login-message login-pin-help" id="loginPinHelp"></p>
<button class="brand-primary-button rs-primary-button" id="enterBtn" type="button">Login</button>
</div>
</section>
<section aria-label="restogogo modules preview" class="brand-module-panel rs-card">
<div aria-label="restogogo main modules" class="brand-module-grid" id="entryModuleGrid"></div>
<div aria-label="Module preview pages" class="brand-module-dots" id="moduleDots"></div>
<button type="button" class="brand-pilot-guide-action" id="pilotGuideLoginBtn" aria-label="Open private pilot guide">
<span>Private pilot guide</span>
<small>How to test Planning, Badge Terminal and Actuals</small>
</button>
</section>
</main>
</div>
</section>
<!-- Main application shell -->
<div class="app-frame" id="appFrame">
<header class="topbar app-topbar app-topbar-v2" id="appTopbar">
<div class="brand app-topbar-v2__brand">
<img alt="restogogo" class="app-product-logo" src="assets/img/brand/restogogo_logo_transparent.png"/>
<span aria-hidden="true" class="restaurant-brand-mark">
<img alt="Restaurant logo" class="brand-restaurant-logo" id="brandLogo" src="logo.png"/>
<span class="brand-restaurant-initial" id="brandRestaurantInitial">R</span>
</span>
<div class="brand-copy">
<p class="eyebrow" id="brandEyebrow">restogogo</p>
<h1 id="appTitle">Planning</h1>
</div>
</div>

<nav aria-label="Main navigation" class="app-topbar-v2__nav" id="appTopNav"></nav>

<div class="top-actions app-topbar-v2__actions">
<div class="notif-wrap">
<button aria-label="Notifications" class="notif-btn" id="notifBtn" title="Notifications"><svg aria-hidden="true" class="btn-svg" viewbox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="notif-badge red-count" id="notifBadgeRed"></span><span class="notif-badge yellow-count" id="notifBadgeYellow"></span></button>
<div class="notif-panel" id="notifPanel"></div>
</div>
<button type="button" class="user-pill" id="userPill" title="Log out / switch user">Not connected</button>
</div>
</header>


<main class="shell" id="appShell">
<section class="page employee-schedule-page employee-schedule-page-v2 rs-v2-page" id="page-employee-schedule">
  <section aria-label="Employee weekly schedule" class="employee-schedule-root" id="employeeScheduleRoot"></section>
</section>

<section class="page employee-schedule-page employee-time-page employee-schedule-page-v2 rs-v2-page" id="page-employee-time">
  <section aria-label="Employee worked time" class="employee-schedule-root" id="employeeTimeRoot"></section>
</section>

<section class="page badge-terminal-page rs-v2-page" id="page-badge-terminal">
  <div class="badge-terminal-shell">
    <section aria-label="Badge terminal" class="badge-terminal-panel rs-v2-frame" id="badgeTerminalRoot"></section>
  </div>
</section>

<section class="page actuals-page rs-v2-page" id="page-actuals">
  <section aria-label="Actuals summary" class="actuals-summary rs-metric-grid rs-weekly-metrics" id="actualsMetrics"></section>
  <section aria-label="Actuals board" class="actuals-board rs-weekly-board rs-panel" id="actualsRoot"></section>
</section>

<section class="page team-page rs-v2-page" id="page-team">
  <section aria-label="Team management" class="team-root" id="teamRoot"></section>
</section>

<section class="page restaurant-page rs-v2-page" id="page-restaurant">
  <section aria-label="Restaurant management" class="restaurant-root" id="restaurantRoot"></section>
</section>

<section class="page planning-page planning-page-v2 rs-v2-page" id="page-planning">
  <section aria-label="Planning summary" class="planning-summary rs-weekly-metrics" id="planningMetrics"></section>
  <div class="planning-board rs-weekly-board rs-panel" id="planningBoard"></div>
</section>
</main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data-adapter.supabase.js"></script>
<script src="assets/js/restogogo-ui.js"></script>
<script src="assets/js/core/app-globals.js"></script>
<script src="assets/js/core/app-utils.js"></script>
<script src="assets/js/core/data-contract.js"></script>
<script src="assets/js/core/data-factory.js"></script>
<script src="assets/js/core/state-service.js"></script>
<script src="assets/js/core/brand-service.js"></script>
<script src="assets/js/core/notification-service.js"></script>
<script src="assets/js/core/workspace-auth.js"></script>
<script src="assets/js/core/app-shell.js"></script>
<script src="assets/js/services/export-service.js"></script>
<script src="assets/js/services/metric-renderer.js"></script>
<script src="assets/js/services/weekly-grid-renderer.js"></script>
<script src="assets/js/services/business-logic.js"></script>
<script src="assets/js/brand-entry.js"></script>
<script src="assets/js/employee-schedule.js"></script>
<script src="assets/js/planning.js"></script>
<script src="assets/js/badge-terminal.js"></script>
<script src="assets/js/actuals.js"></script>
<script src="assets/js/team.js"></script>
<script src="assets/js/restaurant.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
