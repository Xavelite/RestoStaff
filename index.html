<!-- restogogo brand login page -->
<section aria-label="restogogo access" class="brand-page rs-page" id="login">
  <div class="brand-backdrop" aria-hidden="true"></div>
  <main class="brand-entry-shell" aria-label="Sign in">
    <section aria-label="Restaurant sign in" class="brand-login-panel rs-card" id="brandLoginPanel">
      <img alt="restogogo" class="brand-login-logo" src="assets/img/brand/restogogo_logo_transparent.png"/>

      <!-- Access mode selector -->
      <div class="brand-login-tabs" role="tablist" aria-label="Sign in method">
        <button class="brand-login-tab is-active" data-login-role="real" role="tab" aria-selected="true" type="button">Email</button>
        <button class="brand-login-tab" data-login-role="quick" role="tab" aria-selected="false" type="button">Quick access</button>
      </div>

      <!-- Real sign-in form -->
      <div class="brand-login-form" id="loginFormEmail">
        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Restaurant</span>
          <span class="brand-field-control">
            <span class="brand-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 2v20"/><path d="M4 2v6a3 3 0 0 0 6 0V2"/><path d="M15 2v20"/><path d="M15 2c3 2 5 5 5 9h-5"/></svg></span>
            <input autocomplete="organization" id="emailLoginRestaurant" placeholder="demo-restaurant" spellcheck="false" type="text"/>
          </span>
        </label>

        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Email address</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <input autocomplete="username" id="emailLoginName" placeholder="you@restaurant.com"/>
          </span>
        </label>

        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Password</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input autocomplete="current-password" id="emailLoginPassword" maxlength="64" placeholder="Your password" type="password"/>
            <button aria-label="Show or hide password" class="brand-password-toggle" id="toggleLoginPassword" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>

        <p class="brand-login-message" id="emailLoginHelp" aria-live="polite"></p>

        <div class="brand-login-options">
          <button class="brand-soft-link" id="accessHelpLoginBtn" type="button">Forgot access?</button>
        </div>

        <button class="brand-primary-button rs-primary-button" id="emailLoginBtn" type="button">
          <span>Sign in</span>
          <span class="brand-login-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <!-- Quick sign-in form (hidden by default) -->
      <div class="brand-login-form brand-login-form--quick is-hidden" id="loginFormQuick">
        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Restaurant</span>
          <span class="brand-field-control">
            <span class="brand-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 2v20"/><path d="M4 2v6a3 3 0 0 0 6 0V2"/><path d="M15 2v20"/><path d="M15 2c3 2 5 5 5 9h-5"/></svg></span>
            <input autocomplete="organization" id="quickLoginRestaurant" placeholder="demo-restaurant" spellcheck="false" type="text"/>
          </span>
        </label>

        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Quick login name</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <input autocomplete="username" id="quickLoginName" placeholder="FirstName.LastName"/>
          </span>
        </label>

        <label class="brand-field brand-login-field">
          <span class="brand-field-label">4-digit PIN</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input autocomplete="one-time-code" id="quickLoginPin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="4-digit PIN" type="password"/>
          </span>
        </label>

        <p class="brand-login-message" id="quickLoginHelp" aria-live="polite"></p>

        <button class="brand-primary-button rs-primary-button" id="quickLoginBtn" type="button">
          <span>Sign in</span>
          <span class="brand-login-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <div class="brand-login-form brand-login-form--pin-change is-hidden" id="pinChangePanel" aria-live="polite">
        <header class="brand-pin-change-head">
          <strong>Choose your personal PIN</strong>
          <small>Your first quick login uses a temporary PIN. Set your own 4-digit PIN to continue.</small>
        </header>
        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Temporary PIN</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input autocomplete="one-time-code" id="pinChangeCurrent" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="Current PIN" type="password"/>
          </span>
        </label>
        <label class="brand-field brand-login-field">
          <span class="brand-field-label">New PIN</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-5"/></svg>
            <input autocomplete="new-password" id="pinChangeNew" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="New 4-digit PIN" type="password"/>
          </span>
        </label>
        <label class="brand-field brand-login-field">
          <span class="brand-field-label">Confirm new PIN</span>
          <span class="brand-field-control">
            <svg aria-hidden="true" class="brand-field-svg" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
            <input autocomplete="new-password" id="pinChangeConfirm" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="Repeat PIN" type="password"/>
          </span>
        </label>
        <p class="brand-login-message" id="pinChangeHelp" aria-live="polite"></p>
        <button class="brand-primary-button rs-primary-button" id="confirmPinChangeBtn" type="button">
          <span>Save PIN and continue</span>
          <span class="brand-login-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <div class="brand-login-divider"><span>or</span></div>

      <button class="brand-secondary-button" id="openOnboardingBtn" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>Set up a new restaurant</span>
      </button>

      <footer class="brand-login-support">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-2"/><path d="M4 12v3a2 2 0 0 0 2 2h1"/><path d="M13 19h3"/></svg>
        <span>Need help? <button data-login-access-help="true" type="button">Contact support</button></span>
      </footer>
    </section>

    <section aria-label="restogogo product preview" class="brand-preview-panel">
      <header class="brand-hero">
        <h1>Run your restaurant.<br/><span>In sync.</span></h1>
      </header>

      <div aria-label="restogogo main modules" class="brand-module-grid" id="entryModuleGrid"></div>

      <footer class="brand-trust-line">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-5"/></svg>
        <span>Secure. Private. Built for restaurants.</span>
      </footer>
    </section>
  </main>
</section>

<div class="notif-panel" id="notifPanel"></div>
