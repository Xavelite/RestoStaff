project_id = "restogogo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5555"
additional_redirect_urls = ["http://127.0.0.1:5555/**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.send-employee-invitation]
verify_jwt = true

[functions.upload-badge-proof]
verify_jwt = true

[functions.get-badge-proof]
verify_jwt = true

[functions.dispatch-push]
verify_jwt = false

# Website guests do not have a Supabase session. This function performs its
# own revocable channel-key/origin authentication, rate limiting, and then
# calls only service-role-only reservation RPCs.
[functions.reservation-public]
verify_jwt = false
